name: B1

topology:
  nodes:
    switch:
      kind: linux
      image: p4-switch:latest
      binds:
        - okolje:/opt/traffic
      exec:
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev eth3 up
        - ip addr add 10.20.1.2/30 dev eth4
        - ip link set dev eth4 up

    client:
      kind: linux
      image: browser:latest
      shm-size: 1G
      env:
        DISPLAY: ":99"
      binds:
        - okolje:/opt/traffic
      exec:
        - bash -c "echo 1 >/proc/sys/net/ipv6/conf/all/disable_ipv6"
        - ip link set dev eth1 address 00:00:00:00:01:0a
        - ip addr add 10.0.1.10/24 dev eth1
        - ip link set dev eth1 up
        - ip neigh replace 10.0.1.254 lladdr 00:00:00:00:01:fe dev eth1
        - ip route replace default via 10.0.1.254 dev eth1
        - bash -c "echo 'nameserver 1.1.1.1' >/etc/resolv.conf"

    mitm:
      kind: linux
      image: proxy:latest
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - okolje:/opt/traffic
      exec:
        - ip link set dev eth1 address 00:00:00:00:03:0a
        - ip addr add 10.0.3.10/24 dev eth1
        - ip link set dev eth1 up
        - ip neigh replace 10.0.3.254 lladdr 00:00:00:00:03:fe dev eth1
        - ip route replace default via 10.0.3.254 dev eth1
        - ip addr add 10.20.1.1/30 dev eth2
        - ip link set dev eth2 up
        - ip rule add fwmark 1 lookup 100
        - ip route add local 0.0.0.0/0 dev lo table 100
        - iptables -t mangle -A PREROUTING -i eth1 -p udp --dport 443 -j TPROXY --on-port 8080 --tproxy-mark 1
        - iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 443 -j REDIRECT --to-port 8080

    gateway:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip link set dev eth1 address 00:00:00:00:02:0a
        - ip addr add 10.0.2.10/24 dev eth1
        - ip link set dev eth1 up
        - ip neigh replace 10.0.2.254 lladdr 00:00:00:00:02:fe dev eth1
        - ip route replace 10.0.1.0/24 via 10.0.2.254 dev eth1
        - ip route replace 10.0.3.0/24 via 10.0.2.254 dev eth1
        - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

  links:
    - endpoints: ["switch:eth1", "client:eth1"]
    - endpoints: ["switch:eth2", "gateway:eth1"]
    - endpoints: ["switch:eth3", "mitm:eth1"]
    - endpoints: ["switch:eth4", "mitm:eth2"]
