name: mitm_server

topology:
  nodes:
    client:
      kind: linux
      image: client:latest
      cpu: ${CLIENT_CPU:-2}
      memory: 2Gb
      binds:
        - common:/opt/traffic
      exec:
        - ip link set dev eth1 address 00:00:00:00:01:0a
        - ip addr add 10.0.1.10/24 dev eth1
        - ip addr add 10.0.1.11/24 dev eth1
        - ip addr add 10.0.1.12/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.0.1.254 dev eth1

    server:
      kind: linux
      image: server:latest
      cpu: 2
      memory: 2Gb
      binds:
        - common:/opt/traffic
      exec:
        - ip link set dev eth1 address 00:00:00:00:02:0a
        - ip addr add 10.0.2.10/24 dev eth1
        - ip addr add 10.0.2.11/24 dev eth1
        - ip addr add 10.0.2.12/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.0.2.254 dev eth1

    mitm:
      kind: linux
      image: proxy:latest
      cpu: 2
      memory: 2Gb
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - common:/opt/traffic
      exec:
        - ip link set dev eth1 address 00:00:00:00:03:0a
        - ip addr add 10.0.1.254/24 dev eth1
        - ip link set dev eth1 up
        - ip link set dev eth2 address 00:00:00:00:03:0b
        - ip addr add 10.0.2.254/24 dev eth2
        - ip link set dev eth2 up
        # TPROXY ohrani izvorni cilj datagrama, zato mitmproxy prestreze tudi QUIC.
        - ip rule add fwmark 1 lookup 100
        - ip route add local 0.0.0.0/0 dev lo table 100
        - iptables -t mangle -A PREROUTING -i eth1 -p udp --dport 443 -j TPROXY --on-port 8080 --tproxy-mark 1
        # TCP gre prek REDIRECT (SO_ORIGINAL_DST), za odjemalce brez HTTP/3.
        - iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 443 -j REDIRECT --to-port 8080

  links:
    - endpoints: ["client:eth1", "mitm:eth1"]
    - endpoints: ["mitm:eth2", "server:eth1"]
