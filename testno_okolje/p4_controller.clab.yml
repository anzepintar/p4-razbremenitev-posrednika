name: p4_controller

topology:
  nodes:
    switch:
      kind: linux
      image: p4-switch:latest
      cpu: 2
      memory: 2Gb
      exec:
        - ip addr add 10.20.1.2/30 dev eth5
        - ip link set dev eth5 up

    client:
      kind: linux
      image: endpoint:latest
      cpu: 2
      memory: 2Gb
      exec:
        - ip link set dev eth1 address 00:00:00:00:01:0a
        - ip addr add 10.0.1.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.0.1.254 dev eth1

    server:
      kind: linux
      image: endpoint:latest
      cpu: 2
      memory: 2Gb
      exec:
        - ip link set dev eth1 address 00:00:00:00:02:0a
        - ip addr add 10.0.2.10/24 dev eth1
        - ip link set dev eth1 up
        - ip neigh replace 10.0.2.254 lladdr 00:00:00:00:02:fe dev eth1
        - ip route replace default via 10.0.2.254 dev eth1

    mitm:
      kind: linux
      image: mitmproxy-node:latest
      cpu: 2
      memory: 2Gb
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip link set dev eth1 address 00:00:00:00:03:0a
        - ip addr add 10.0.3.10/24 dev eth1
        - ip link set dev eth1 up
        - ip neigh replace 10.0.3.254 lladdr 00:00:00:00:03:fe dev eth1
        - ip route replace 10.0.1.0/24 via 10.0.3.254 dev eth1
        - ip route replace 10.0.2.0/24 via 10.0.3.254 dev eth1
        - iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 443 -j REDIRECT --to-port 8080
        - iptables -t nat -A PREROUTING -i eth1 -p udp --dport 443 -j REDIRECT --to-port 8443

    ids:
      kind: linux
      image: ids:latest
      cpu: 2
      memory: 2Gb
      exec:
        - ip link set dev eth1 address 00:00:00:00:04:0a
        - ip link set dev eth1 up

    controller:
      kind: linux
      image: p4-controller:latest
      cpu: 2
      memory: 2Gb
      exec:
        - ip addr add 10.20.1.1/30 dev eth1
        - ip link set dev eth1 up

  links:
    - endpoints: ["switch:eth1", "client:eth1"]
    - endpoints: ["switch:eth2", "server:eth1"]
    - endpoints: ["switch:eth3", "mitm:eth1"]
    - endpoints: ["switch:eth4", "ids:eth1"]
    - endpoints: ["switch:eth5", "controller:eth1"]
