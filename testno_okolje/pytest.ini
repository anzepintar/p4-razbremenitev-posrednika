[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Nivoji: unit tece povsod, integration bere krmiljenje.p4, e2e potrebuje tekoco postavitev.
markers =
    unit: brez postavitve in brez vsebnikov
    integration: bere vire projekta, a ne potrebuje postavitve
    e2e: potrebuje tekoco postavitev B0

filterwarnings =
    ignore::DeprecationWarning:mitmproxy.*
    ignore:.*pyparsing.*:DeprecationWarning
    ignore::UserWarning:pyparsing.*
