testset:
  set: osnovni # osnovni (50+50) ali testni (950+50)
  path: /opt/traffic/server/testset
  ips: [10.0.2.10, 10.0.2.11, 10.0.2.12]

clients:
  - {id: c1, src_ip: 10.0.1.10, trust: high, profile: office}
  - {id: c2, src_ip: 10.0.1.11, trust: medium, profile: browsing}
  - {id: c3, src_ip: 10.0.1.12, trust: low, profile: suspicious}

profiles:
  office:
    protocols: {h2: 0.7, h3: 0.3}
    labels: [ben]
    rate: 2.0
    think_time: [0.5, 3.0]

  browsing:
    protocols: {h2: 0.5, h3: 0.5}
    labels: [ben, mal]
    rate: 1.5
    think_time: [1.0, 4.0]

  suspicious:
    protocols: {h2: 0.5, h3: 0.5}
    labels: [mal]
    rate: 3.0
    think_time: [0.2, 1.0]
    fronting: {share: 0.5}

policy:
  mitm: {high: direct, medium: direct, low: via_mitm}
  ids: {high: mirror, medium: mirror, low: mirror}
  full: {high: mirror, medium: mirror, low: via_mitm}

run:
  duration: 60
  seed: 1234
  out: /opt/traffic/out
  cacert: /opt/traffic/pki/trust.pem
  max_subresources: 25
