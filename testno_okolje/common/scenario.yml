testset:
  set: testni # osnovni (50+50) ali testni (950+50)
  path: /opt/traffic/server/testset
  ip: 10.0.2.10

# ZACASNO en sam odjemalec, ker curl brez --interface vzame prvi naslov na eth1.
# Pred meritvijo zbrisi zacasno vrstico in odkomentiraj izvirne tri; v clab datotekah
# je treba vrniti tudi naslova .11 in .12. Glej readme "En odjemalec ali trije".
clients:
  - {id: c1, src_ip: 10.0.1.10, profile: browsing}
  # - {id: c1, src_ip: 10.0.1.10, profile: office}
  # - {id: c2, src_ip: 10.0.1.11, profile: browsing}
  # - {id: c3, src_ip: 10.0.1.12, profile: suspicious}

profiles:
  office:
    protocols: {h2: 0.7, h3: 0.3}
    labels: [ben]
    rate: 2.0
    think_time: [0.5, 3.0]

  browsing:
    protocols: {h2: 0.5, h3: 0.5}
    labels: [ben, mal]
    rate: 1.5
    think_time: [1.0, 4.0]

  suspicious:
    protocols: {h2: 0.5, h3: 0.5}
    labels: [mal]
    rate: 3.0
    think_time: [0.2, 1.0]
    fronting: {share: 0.5}

# Crni in beli seznam sta v lists/domain_*.txt in lists/ip_*.txt, prednapolni jih gen_lists.py.

run:
  duration: 60
  seed: 1234
  out: /opt/traffic/out
  cacert: /opt/traffic/pki/trust.pem
  max_subresources: 25
