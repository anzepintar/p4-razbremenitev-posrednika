testset:
  set: osnovni
  path: /opt/traffic/server/testset
  ips: [127.0.0.1]

clients:
  - {id: c1, src_ip: 127.0.0.1, trust: high, profile: office}
  - {id: c2, src_ip: 127.0.0.2, trust: medium, profile: browsing}
  - {id: c3, src_ip: 127.0.0.3, trust: low, profile: suspicious}

profiles:
  office:
    protocols: {h2: 1.0}
    labels: [ben]
    rate: 20.0
    think_time: [0.0, 0.05]

  browsing:
    protocols: {h3: 1.0}
    labels: [ben, mal]
    rate: 20.0
    think_time: [0.0, 0.05]

  suspicious:
    protocols: {h2: 1.0}
    labels: [mal]
    rate: 20.0
    think_time: [0.0, 0.05]
    fronting: {share: 1.0}

run:
  duration: 10
  seed: 1234
  out: /work/out
  cacert: /work/trust.pem
  max_subresources: 10
